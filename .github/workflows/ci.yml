name: ci

# PR validation. Runs the full-matrix pytest (with coverage) and the
# bare-install smoke test; pre-commit runs in `lint.yml`, the docs build in
# `docs-checks.yml`. It also runs on pushes to `main`, so the coverage comment
# has main's coverage to compare a pull request against; a documentation-only
# commit does not change the coverage, so the `push` trigger skips those.
#
# The `pull_request` trigger has no path filter: a workflow skipped by a path
# filter leaves its required checks pending forever. Branch protection on
# `main` requires one check from here, `tests-passed`. On a pull request that
# changes only documentation, the `changes` job turns the test jobs off and
# `tests-passed` passes without them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/CODEOWNERS"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # `code` is false when a pull request changes only the paths the `push`
    # trigger ignores.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed call fails the job, and `tests-passed` with it.
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -qvE '\.md$|^docs/|^\.github/CODEOWNERS$' <<< "$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      # `perceval` is kept out of `all` (see pyproject.toml), so the photonics
      # tests need it named here.
      extras: "all,perceval"
      coverage: true

  test-macos:
    # The full suite on Apple silicon. One Python version: the `test` matrix
    # already covers the version spread.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      python-versions: '["3.13"]'
      extras: "all,perceval"
      runs-on: macos-latest

  test-windows:
    # The full suite on Windows, which the package supports: there the
    # `chemistry` extra leaves PySCF out. One Python version, as on macOS.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      python-versions: '["3.13"]'
      extras: "all,perceval"
      runs-on: windows-latest

  test-core-only:
    # The numpy core must install, import, and run with NO optional extras
    # (no torch / pennylane / qiskit / ...). Enforces the import-linter
    # contracts (static guard against unguarded optional imports in src/) and
    # runs the framework-free tests: the lazy-import smoke checks plus the numpy
    # reference simulator's own behaviour (its cross-framework parity tests skip
    # when the extras are absent). The full matrix runs in the `test` job
    # (extras=all). Mirrored by release.yml's `verify-core-only`.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      python-versions: '["3.13"]'
      extras: ""
      lint-imports: true
      test-paths: "tests/core/test_torch_free_import.py tests/core/test_numpy_backend.py"

  test-missing-importorskip:
    # Catch a test that forgot its `pytest.importorskip` or `pennylane` mark.
    # Installs the default DL stack (the `torch` extra -> torch + scikit-learn)
    # but NOT the optional backends (pennylane / qiskit / braket / cudaq) or
    # chemistry, then runs the FULL suite. A test that uses one of those
    # without a guard ERRORs here — whereas the `test` job
    # (extras=all, everything installed) would silently pass. Complements
    # `test-core-only`, whose `lint-imports` statically catches the other half:
    # an unguarded optional import in `src/`. One Python version suffices; this
    # checks import guards, not behaviour, so it skips coverage.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      python-versions: '["3.13"]'
      extras: "torch"

  tests-passed:
    # The one check branch protection on `main` requires from this workflow,
    # so a new job or Python version needs no change there. Passes when every
    # test job passed or was turned off by `changes`. `always()`, not
    # `!cancelled()`: a cancelled run must fail this check, not skip it,
    # because a skipped check counts as passed.
    needs: [changes, test, test-macos, test-windows, test-core-only, test-missing-importorskip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: A test job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  coverage-comment:
    needs: test
    # On a push to main the action stores main's coverage on the
    # `python-coverage-comment-action-data` branch; on a pull request it
    # compares against that and posts the comment. A pull request from a fork
    # gets a read-only token, so the comment could not be posted.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the coverage data to the data branch
      pull-requests: write
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7
        with:
          # The action pushes with its own token; keep the write token out of .git/config.
          persist-credentials: false

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data

      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f  # v4.5; v4 publishes immutable releases only
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
