name: lint

# pre-commit on every pull request: formatting, ruff, file hygiene, and the
# example notebooks against their pages (see .pre-commit-config.yaml).
#
# A workflow of its own because `ci.yml` skips documentation-only pull
# requests, and those are exactly the ones that change the example pages the
# notebooks are generated from.

on:
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check-out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
